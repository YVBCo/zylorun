<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Vibrant Brand Gradients -->
    <linearGradient id="neon-z" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="accent-indigo" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Rounded Shield Container -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="none" stroke="url(#neon-z)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Ambient Glow Blob -->
  <circle cx="128" cy="128" r="70" fill="#06b6d4" opacity="0.12" filter="url(#neon-glow)"/>

  <!-- Speed Velocity Ribbon Bars (Top Left & Bottom Right) -->
  <path d="M 52 68 L 108 68" stroke="url(#glow-cyan)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M 64 80 L 96 80" stroke="url(#glow-cyan)" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  <path d="M 148 188 L 204 188" stroke="url(#accent-indigo)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M 160 176 L 192 176" stroke="url(#accent-indigo)" stroke-width="3" stroke-linecap="round" opacity="0.3"/>

  <!-- Main Iconic "Z" Glyph Structure -->
  <g filter="url(#subtle-shadow)">
    <!-- Top Horizontal Beam -->
    <path d="M 62 82 C 62 75.37 67.37 70 74 70 L 186 70 C 193.73 70 198.8 78.11 195.34 85.03 L 178 119.7 L 138 119.7 L 157 82 Z" 
          fill="url(#neon-z)"/>

    <!-- Diagonal Dynamic Velocity Traverse -->
    <path d="M 174 88 L 84 176 L 126 176 L 206 98 C 209.5 94.5 208 88 202 88 Z" 
          fill="url(#accent-indigo)" opacity="0.95"/>

    <!-- Bottom Horizontal Runner Beam -->
    <path d="M 194 174 C 194 180.63 188.63 186 182 186 L 70 186 C 62.27 186 57.2 177.89 60.66 170.97 L 78 136.3 L 118 136.3 L 99 174 Z" 
          fill="url(#neon-z)"/>

    <!-- Center Cyber Pulse Diamond Core -->
    <polygon points="128,110 146,128 128,146 110,128" fill="#ffffff" opacity="0.9"/>
    <circle cx="128" cy="128" r="3" fill="#06b6d4"/>
  </g>

  <!-- Modern Corner Accent Nodes -->
  <circle cx="74" cy="70" r="3" fill="#10b981"/>
  <circle cx="182" cy="186" r="3" fill="#3b82f6"/>
</svg>
